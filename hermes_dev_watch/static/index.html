<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width">
<title>Hermes Dev Watch</title>
<style>
@font-face{font-family:JBM;src:url(fonts/JetBrainsMono-Regular.woff2) format('woff2');font-weight:400}
@font-face{font-family:JBM;src:url(fonts/JetBrainsMono-Bold.woff2) format('woff2');font-weight:700}
:root{--bg:#0b0c0f;--panel:#0e1014;--line:#23262d;--fg:#d7dae0;--mut:#8a8f98;--dim:#5b616b;--faint:#2a2e36;
 --amber:#e8b44c;--blue:#6ea8ff;--green:#8fd16a;--pink:#ff7a9c;--purple:#b48cff;--cyan:#5fd4e6;--red:#ff6b6b;--orange:#f2994a;
 --ok:var(--green);--bad:var(--red);--warn:var(--amber);--sel:#161920;
 --dev:var(--blue);--reviewer:var(--purple);--docs:var(--cyan);--researcher:var(--amber);--planner:var(--orange);--other:var(--mut)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font:13.5px/1.6 JBM,ui-monospace,Consolas,monospace;font-variant-ligatures:none;
 height:100vh;display:flex;flex-direction:column;overflow:hidden}
button,select,input{font:inherit;color:inherit}
header{display:flex;align-items:flex-end;gap:26px;padding:12px 22px 0;border-bottom:1px solid var(--line);white-space:nowrap}
header>*{padding-bottom:9px}
.brand{color:var(--fg)}.brand b{color:var(--amber);font-weight:700}.brand .d{color:var(--dim)}
.nav{background:none;border:0;border-bottom:2px solid transparent;border-radius:0;color:var(--mut);padding:0 2px 7px;cursor:pointer}
.nav:hover{color:var(--fg)}.nav.on{color:var(--amber);border-bottom-color:var(--amber)}
.pj{color:var(--mut)}
select{-webkit-appearance:none;appearance:none;background:none;border:0;outline:none;color:var(--fg);cursor:pointer;padding:0 14px 0 0;
 background-image:linear-gradient(45deg,transparent 50%,var(--dim) 50%),linear-gradient(135deg,var(--dim) 50%,transparent 50%);
 background-position:calc(100% - 5px) 55%,calc(100% - 1px) 55%;background-size:4px 4px;background-repeat:no-repeat}
select option{background:var(--panel);color:var(--fg)}
input{background:none;border:0;outline:none}
input[type=checkbox]{-webkit-appearance:none;appearance:none;cursor:pointer;margin:0 4px 0 0;vertical-align:baseline}
input[type=checkbox]::before{content:"[ ]";color:var(--dim)}input[type=checkbox]:checked::before{content:"[x]";color:var(--amber)}
.sp{flex:1}
.stat{color:var(--dim);white-space:nowrap}.stat b{color:var(--fg);font-weight:400}.stat b.ok{color:var(--green)}.stat b.bad{color:var(--red)}
.btn{background:none;border:0;border-radius:0;padding:0;color:var(--mut);cursor:pointer;white-space:nowrap}
.btn::before{content:"["}.btn::after{content:"]"}
.btn:hover{color:var(--fg)}.btn.on{color:var(--amber);font-weight:700}
#upd{color:var(--amber)}#upd[hidden]{display:none}#upd .btn{color:var(--amber)}
#ghbtn{display:flex;align-items:center;color:var(--mut)}#ghbtn::before,#ghbtn::after{content:none}
/* the top bar never overflows: the picker and today's numbers shrink, the update banner and GitHub button never do */
#ghbtn{flex-shrink:0}#upd{flex-shrink:0}.brand,.nav{flex-shrink:0}
.pj{min-width:90px;display:flex;overflow:hidden}
#proj{max-width:240px;text-overflow:ellipsis;min-width:90px;white-space:nowrap}
#stats{flex-shrink:0}#stats .ss{display:none}#upd .short{display:none}
@media (max-width:1399px){#stats .sl{display:none}#stats .ss{display:inline}}
@media (max-width:1299px){#upd .long{display:none}#upd .short{display:inline}#stats .lp{display:none}header{gap:16px}}
@media (max-width:1099px){.brand .full{display:none}.pj .pl{display:none}}
.cols{flex:1;display:grid;grid-template-columns:330px 1fr 380px;gap:22px;padding:22px;min-height:0}
.col{display:flex;flex-direction:column;gap:22px;min-height:0;min-width:0}
@media (max-width:1199px){.cols{grid-template-columns:330px 1fr}#right{display:none}}
fieldset{margin:0;border:1px solid var(--line);border-radius:6px;padding:10px 16px 14px;min-height:0;min-width:0;background:var(--panel)}
fieldset.grow{flex:1;overflow:hidden;display:flex;flex-direction:column}
legend{padding:0 8px;margin-left:4px;color:var(--fg)}legend::before{content:"$ ";color:var(--amber)}legend .a{color:var(--dim)}
.c{color:var(--dim)}.c::before{content:"// "}
.am{color:var(--amber)}.gr{color:var(--green)}.rd{color:var(--red)}.mu{color:var(--mut)}.dm{color:var(--dim)}.bl{color:var(--blue)}
.bar{display:inline-flex;gap:2px;vertical-align:middle;margin-right:10px}
.bar i{width:9px;height:14px;background:var(--faint)}.bar i.f{background:var(--amber)}
#beacon{display:none;width:7px;height:7px;border-radius:50%;background:var(--green);margin-right:8px;vertical-align:1px}
#beacon.on{display:inline-block;animation:ping 1.6s infinite}
@keyframes ping{0%{box-shadow:0 0 0 0 color-mix(in srgb,var(--green) 60%,transparent)}100%{box-shadow:0 0 0 8px transparent}}
#q{width:100%;border-bottom:1px solid var(--line);padding:2px 0;margin-bottom:6px}#q::placeholder{color:var(--dim)}#q:focus{border-bottom-color:var(--amber)}
#fbar{display:flex;align-items:center;gap:0 10px;flex-wrap:wrap;padding-bottom:6px}
#fbar .sep{flex-basis:100%;height:0}#fbar select{color:var(--mut)}
#side{flex:1;min-height:0;overflow:auto;margin:0 -8px;padding:0 8px;display:flex;flex-direction:column}
#side>*{flex:none}
.day{position:sticky;top:0;background:var(--panel);padding:8px 0 2px;color:var(--dim);z-index:1}
.run{padding:3px 6px;margin:0 -6px;border-radius:3px;cursor:pointer}.run:hover,.run.sel{background:var(--sel)}
.row{display:flex;gap:10px;align-items:baseline;min-width:0}
.role{color:var(--c);flex:none}
.when{color:var(--mut);margin-left:auto;white-space:nowrap}
.what{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.proj{color:var(--mut);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sub{padding-left:34px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.v{color:var(--mut)}.v b{font-weight:400}.ok{color:var(--green)}.bad{color:var(--red)}.warn{color:var(--amber)}
#main{flex:1;min-height:0;display:flex;flex-direction:column}
.set{overflow:auto;flex:1}.set h2{font-size:13.5px;margin:0 0 4px;color:var(--amber)}.set h3{font-size:13.5px;margin:18px 0 6px}
.set p{color:var(--dim);margin:0 0 8px}.set .row{padding:5px 0;border-bottom:1px solid var(--line)}
.set .row code{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.set .found{color:var(--mut);margin-top:4px}
#toasts{position:fixed;right:14px;bottom:14px;display:flex;flex-direction:column;gap:8px;z-index:9}
.toast{background:var(--panel);border:1px solid var(--line);border-left:3px solid var(--c);border-radius:6px;padding:9px 12px;
 min-width:260px;max-width:380px;box-shadow:0 6px 24px #0008;cursor:pointer;animation:tin .2s}
@keyframes tin{from{transform:translateY(8px);opacity:0}}
.empty{margin:auto;text-align:center;color:var(--mut);line-height:1.8}.empty h2{color:var(--fg);font-size:13.5px;margin:0 0 6px}
.board{flex:1;overflow:auto;display:grid;gap:12px;grid-template-columns:repeat(auto-fill,minmax(340px,1fr));align-content:start}
.tile{background:var(--bg);border:1px solid var(--line);border-radius:6px;overflow:hidden;cursor:pointer;display:flex;flex-direction:column}
.tile:hover{border-color:var(--amber)}
.th{padding:6px 12px;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:8px;min-width:0}
.pulse{width:7px;height:7px;border-radius:50%;background:var(--green);flex:none;animation:ping 1.6s infinite}
.tb{padding:6px 0;height:250px;overflow:hidden;display:flex;flex-direction:column;justify-content:flex-end;
 -webkit-mask-image:linear-gradient(to bottom,transparent,#000 40px);mask-image:linear-gradient(to bottom,transparent,#000 40px)}
.dh{flex:none;padding-bottom:10px;border-bottom:1px solid var(--line)}
.dh .t{display:flex;align-items:center;gap:8px}
.tools{display:flex;gap:10px;margin-top:8px;align-items:center;flex-wrap:wrap}
#fb{display:flex;gap:10px;flex-wrap:wrap}
.log{flex:1;overflow:auto;padding:6px 0 10px;font-size:12.5px;line-height:1.65}
.l{display:flex;gap:12px;padding:0 4px}
.log .l:hover{background:var(--sel)}
.l .ts{color:var(--dim);width:46px;flex:none;text-align:right}
.l .k{width:64px;flex:none;color:var(--mut);overflow:hidden;text-overflow:ellipsis}
.l .x{white-space:pre-wrap;word-break:break-word;min-width:0}
.l.say .k,.l.say .x{color:var(--purple)}
.l.edit .k,.l.edit .x{color:var(--blue)}.l.bash .k,.l.bash .x{color:var(--amber)}
.l.denied .k,.l.denied .x{color:var(--red)}
.l.error .k,.l.error .x{color:var(--orange)}
.log .l.sm{background:color-mix(in srgb,var(--amber) 22%,transparent)}
.log .l.sc{background:color-mix(in srgb,var(--amber) 42%,transparent);box-shadow:inset 3px 0 var(--amber)}
#ls{flex:1;min-width:120px;max-width:260px;border-bottom:1px solid var(--line);padding:0}#ls::placeholder{color:var(--dim)}#ls:focus{border-bottom-color:var(--amber)}
.tile .l{padding:0 12px;font-size:11.5px;line-height:1.5}.tile .l .ts{width:40px}
.tile .l .x{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#ov{flex:1;overflow:auto}#ov h4{margin:12px 0 0;font-weight:700;font-size:13.5px}#ov section:first-child h4{margin-top:0}
#ov h4 .ic{display:inline-block;width:18px;color:var(--amber)}#ov section>div{padding-left:18px}
::-webkit-scrollbar{width:10px;height:10px}::-webkit-scrollbar-track{background:var(--panel)}
::-webkit-scrollbar-thumb{background:var(--line);border-radius:10px;border:2px solid var(--panel);background-clip:padding-box}
</style></head><body>
<header>
 <span class="brand" title="hermes.DevWatch">[<b>w</b>]<span class="full"> <b>hermes.DevWatch</b> <span class="d" id="ver"></span></span></span>
 <button class="nav" id="livebtn">live</button>
 <button class="nav" id="setbtn" title="Project folders">settings</button>
 <label class="pj"><span class="pl">project:&nbsp;</span><select id="proj"></select></label>
 <span class="sp"></span>
 <span id="upd" hidden></span>
 <span class="stat warn" id="fmtwarn" hidden></span>
 <span class="stat" id="stats"></span>
 <button class="btn" id="ghbtn" title="hermes-dev-watch on GitHub"><svg viewBox="0 0 16 16" width="16" height="16" fill="currentColor" aria-hidden="true"><path d="M8 0C3.58 0 0 3.58 0 8c0 3.54 2.29 6.53 5.47 7.59.4.07.55-.17.55-.38 0-.19-.01-.82-.01-1.49-2.01.37-2.53-.49-2.69-.94-.09-.23-.48-.94-.82-1.13-.28-.15-.68-.52-.01-.53.63-.01 1.08.58 1.23.82.72 1.21 1.87.87 2.33.66.07-.52.28-.87.51-1.07-1.78-.2-3.64-.89-3.64-3.95 0-.87.31-1.59.82-2.15-.08-.2-.36-1.02.08-2.12 0 0 .67-.21 2.2.82.64-.18 1.32-.27 2-.27.68 0 1.36.09 2 .27 1.53-1.04 2.2-.82 2.2-.82.44 1.1.16 1.92.08 2.12.51.56.82 1.27.82 2.15 0 3.07-1.87 3.75-3.65 3.95.29.25.54.73.54 1.48 0 1.07-.01 1.93-.01 2.2 0 .21.15.46.55.38A8.013 8.013 0 0016 8c0-4.42-3.58-8-8-8z"/></svg></button>
</header>
<div id="toasts"></div>
<div class="cols">
 <div class="col" id="left">
  <fieldset id="status"><legend>status</legend>
   <div><i id="beacon"></i><span id="stv"></span></div>
   <div id="stbar" style="margin-top:8px"></div>
  </fieldset>
  <fieldset class="grow"><legend>runs <span class="a" id="rleg">--all</span></legend>
   <input id="q" placeholder="filter: role, ticket, verdict…">
   <div id="fbar"></div>
   <div id="side"></div>
  </fieldset>
 </div>
 <div class="col" id="mid"><fieldset class="grow"><legend id="mleg">live</legend><div id="main"></div></fieldset></div>
 <div class="col" id="right"><fieldset class="grow"><legend>stats <span class="a">--overview</span></legend>
  <div id="ov"><section id="ovtoday"></section></div></fieldset></div>
</div>
<script>
const $=id=>document.getElementById(id);
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
// view.k: 'live' = board of running workers; 'run' = one run's log. Opening a run is sticky until "live" or "←".
// WebKitGTK loads the page as about:blank, where localStorage throws: keep the choice in memory then
const store={get(k){try{return localStorage.getItem(k)}catch(e){return null}},set(k,v){try{localStorage.setItem(k,v)}catch(e){}}};
let S={projects:[]},proj=store.get('proj')||'*',view={k:'live'},seenLive=null,off=0,logFor=null,filt='all',follow=true;
const ROLES=['dev','reviewer','docs','researcher','planner'];
const rc=r=>`--c:var(--${ROLES.includes(r)?r:'other'})`;
const setLeg=h=>{if($('mleg').dataset.h!==h){$('mleg').dataset.h=h;$('mleg').innerHTML=h}};
const sdate=s=>new Date(+s.slice(0,4),+s.slice(4,6)-1,+s.slice(6,8),+s.slice(9,11),+s.slice(11,13),+s.slice(13,15));
const hm=d=>d.toTimeString().slice(0,5);
function dayLabel(d){const t=new Date();t.setHours(0,0,0,0);const x=new Date(d);x.setHours(0,0,0,0);
 const n=Math.round((t-x)/864e5);return n===0?'today':n===1?'yesterday':x.toLocaleDateString(undefined,{weekday:'short',day:'numeric',month:'short'}).toLowerCase()}
function dur(s){s=+s;if(!(s>=0))return'';return s<60?s+'s':s<3600?Math.floor(s/60)+'m '+(s%60)+'s':Math.floor(s/3600)+'h '+Math.floor(s%3600/60)+'m'}
function vk(v){v=v||'';return /^PASS/.test(v)?'ok':/^(FAIL|ERROR)/.test(v)?'bad':'warn'}
function vtxt(r){if(r.live)return'<b class="ok">running</b> · '+dur(Math.round((Date.now()-sdate(r.stamp))/1e3));
 const v=r.verdict||'',m=v.match(/^(\S+)\s*(.*)$/)||['',v,''];return `<b class="${vk(v)}">${esc(m[1])}</b> ${esc(m[2])}`}
// the dim second line of a run in the list: "// <verdict> · <duration>"
function sub(r){if(r.live)return'running · '+dur(Math.round((Date.now()-sdate(r.stamp))/1e3));
 return[r.verdict||'no result',r.secs?dur(r.secs):''].filter(Boolean).join(' · ')}
// marker of a run: [~] live, [i] planner line, [✓] pass, [✗] fail, [?] no result
function marker(r){const v=r.verdict||'';
 return r.live?['~','am']:r.role==='planner'?['i','mu']:/^PASS/.test(v)?['✓','gr']:/^(FAIL|ERROR)/.test(v)?['✗','rd']:['?','dm']}
function title(r){return r.ticket&&r.ticket!=='-'?r.ticket.replace(/\.md$/,''):(r.feature||'—')}
function kind(x){if(x.startsWith('say: '))return['say','says',x.slice(5)];if(x.startsWith('DENIED '))return['denied','DENIED',x.slice(7)];
 if(x.startsWith('exit!=0 '))return['error','failed',x.slice(8)];const sp=x.indexOf(' '),t=sp<0?x:x.slice(0,sp),rest=sp<0?'':x.slice(sp+1);
 const k=/^(Edit|Write|MultiEdit|NotebookEdit|write_file|patch)$/.test(t)?'edit':/^(Bash|terminal)$/.test(t)?'bash':'';return[k,t,rest]}
function lineHTML(l){const m=l.match(/^\s*\[\s*(\d+)s\]\s?(.*)$/);
 if(!m)return`<div class="l"><span class="ts"></span><span class="k"></span><span class="x">${esc(l)}</span></div>`;
 const [k,t,x]=kind(m[2]);return`<div class="l ${k}" data-k="${k||'other'}"><span class="ts">${dur(m[1])}</span><span class="k">${esc(t)}</span><span class="x" title="${esc(x)}">${esc(x)}</span></div>`}
// the run filter (sent to the reader on every poll); `filt` above is the line-kind filter of a run's log
const VGROUPS=[['pass','pass'],['fail','fail'],['none','no result'],['running','running']],DAYSEL=[['today','Today'],['7','7 days'],['30','30 days'],['all','All']];
function loadRF(){let o={};try{o=JSON.parse(store.get('runfilter'))||{}}catch(e){}
 const arr=a=>Array.isArray(a)?a.filter(x=>typeof x==='string'):[];
 return{verdict:arr(o.verdict),role:arr(o.role),days:DAYSEL.some(d=>d[0]===o.days)?o.days:'all',q:typeof o.q==='string'?o.q:''}}
let runFilter=loadRF();
const saveRF=()=>store.set('runfilter',JSON.stringify(runFilter));
function shown(){return S.projects.filter(p=>proj==='*'||p.id===proj)}
function allRuns(){return shown().flatMap(p=>p.runs).sort((a,b)=>a.stamp<b.stamp?1:a.stamp>b.stamp?-1:0)}
function liveRuns(){return shown().flatMap(p=>p.live_runs||[]).sort((a,b)=>a.stamp<b.stamp?1:a.stamp>b.stamp?-1:0)}
function find(pid,id){const p=S.projects.find(x=>x.id===pid);return p&&(p.runs.find(r=>r.id===id)||(p.live_runs||[]).find(r=>r.id===id))}
function renderBar(){
 const roles=[...new Set(shown().flatMap(p=>p.roles||[]))].sort(),chip=(k,v,n)=>`<button class="btn ${runFilter[k].includes(v)?'on':''}" data-rf="${k}" data-v="${esc(v)}">${esc(n)}</button>`;
 const h=VGROUPS.map(([v,n])=>chip('verdict',v,n)).join('')+'<span class="sep"></span>'+roles.map(r=>chip('role',r,r)).join('')+'<span class="sep"></span>'+
  `<select id="rfdays">${DAYSEL.map(([v,n])=>`<option value="${v}" ${runFilter.days===v?'selected':''}>${n}</option>`).join('')}</select><button class="btn" id="rfclear">clear filters</button>`;
 $('rleg').textContent='--'+runFilter.days;
 const bar=$('fbar');if(bar.dataset.h===h)return;bar.dataset.h=h;bar.innerHTML=h;
 for(const b of bar.querySelectorAll('[data-rf]'))b.onclick=()=>{const a=runFilter[b.dataset.rf],i=a.indexOf(b.dataset.v);i<0?a.push(b.dataset.v):a.splice(i,1);changed()};
 $('rfdays').onchange=e=>{runFilter.days=e.target.value;changed()};
 $('rfclear').onclick=()=>{runFilter={verdict:[],role:[],days:'all',q:''};$('q').value='';changed()};
}
async function changed(){saveRF();renderBar();try{S=await API.state(runFilter);render()}catch(e){$('stats').textContent='reader error: '+e}}
const blocks=f=>`<span class="bar">${Array.from({length:12},(_,i)=>`<i class="${i<f?'f':''}"></i>`).join('')}</span>`;
function renderTop(){
 const opts=[['*','All projects',S.projects.reduce((a,p)=>a+p.live,0)],...S.projects.map(p=>[p.id,p.id,p.live])];
 if(!opts.some(o=>o[0]===proj))proj='*';
 const h=opts.map(([v,n,l])=>`<option value="${esc(v)}" ${v===proj?'selected':''}>${esc(n)}${l?` · ${l} running`:''}</option>`).join('');
 if($('proj').dataset.h!==h){$('proj').innerHTML=h;$('proj').dataset.h=h}
 const tds=shown().map(p=>p.today||{}),n=tds.reduce((a,t)=>a+(t.runs||0),0),pass=tds.reduce((a,t)=>a+(t.pass||0),0),cost=tds.reduce((a,t)=>a+(t.cost||0),0),pl=tds.reduce((a,t)=>a+(t.planner||0),0),lv=liveRuns();
 $('ver').textContent=S.version?`[${S.version}]`:'';document.querySelector('.brand').title='hermes.DevWatch'+(S.version?` ${S.version}`:'');
 $('stats').innerHTML=`<span class="sl">today </span><b>${n}</b> runs · <b class="ok">${pass}</b><span class="sl"> pass</span><span class="ss"> ✓</span> · <b class="bad">${n-pass}</b><span class="sl"> fail</span><span class="ss"> ✗</span><span class="lp"> · <span class="sl">list </span><b>$${cost.toFixed(2)}</b></span>`+(pl?` · <b>${pl}</b> planner`:'');
 $('stats').title=`today ${n} runs · ${pass} pass · ${n-pass} fail · list $${cost.toFixed(2)}`+(pl?` · ${pl} planner`:'');
 const pct=n?Math.round(pass/n*100):0;
 $('stv').innerHTML=lv.length?`<span class="gr">${lv.length} running</span>`+lv.map(r=>`<div class="what"><span class="role" style="${rc(r.role)}">${esc(r.role)}</span> <span class="bl">${esc(title(r))}</span></div>`).join(''):'<span class="c">no worker running</span>';
 $('stbar').innerHTML=`${blocks(Math.round(pct*12/100))}${pct}% <span class="dm">[${pass}/${n} pass today]</span>`;
 $('ovtoday').innerHTML=`<h4><span class="ic">◉</span>today</h4><div class="c">runs across watched projects</div>
  <div>runs: <span class="am">${n}</span></div><div>pass: <span class="am">${pass}</span></div><div>fail: <span class="am">${n-pass}</span></div><div>list cost: <span class="am">$${cost.toFixed(2)}</span></div>`;
 const nf=S.projects.filter(p=>p.newer_format);$('fmtwarn').hidden=!nf.length;
 $('fmtwarn').textContent=nf.length?`⚠ kit format ${Math.max(...nf.map(p=>p.fmt))} is newer than this watcher (${S.known_format??1}): update hermes-dev-watch`:'';
 $('fmtwarn').title=nf.length?'Some fields may be missing or wrong in: '+nf.map(p=>p.id).join(', '):'';
 $('beacon').className=lv.length?'on':'';$('livebtn').textContent=`live${lv.length?' · '+lv.length:''}`;$('livebtn').classList.toggle('on',view.k==='live');$('setbtn').classList.toggle('on',view.k==='settings');
}
function renderSide(){
 const rs=allRuns();
 let h=shown().filter(p=>p.total>p.runs.length).map(p=>`<div class="day">// ${esc(p.id)}: showing ${p.runs.length} of ${p.total}</div>`).join(''),last='';
 for(const r of rs){const d=dayLabel(sdate(r.stamp));if(d!==last){h+=`<div class="day">// ${esc(d)}</div>`;last=d}
  const sel=view.k==='run'&&view.p===r.project&&view.id===r.id,[mk,mc]=marker(r);
  h+=`<div class="run ${sel?'sel':''}" data-p="${esc(r.project)}" data-id="${r.id}"><div class="row">
   <span class="${mc}">[${mk}]</span><span class="role" style="${rc(r.role)}">${esc(r.role)}</span>
   ${proj==='*'?`<span class="proj">${esc(r.project)}</span>`:''}<span class="what" title="${esc(r.feature)}">${esc(title(r))}</span><span class="when">${hm(sdate(r.stamp))}</span></div>
   <div class="sub c">${esc(sub(r))}</div></div>`}
 const sc=$('side').scrollTop;$('side').innerHTML=rs.length?h:h+'<div class="c" style="padding:12px 0">no runs</div>';$('side').scrollTop=sc;
 for(const d of document.querySelectorAll('.run'))d.onclick=()=>open(d.dataset.p,d.dataset.id);
}
function open(p,id){view={k:'run',p,id};logFor=null;render();pull()}
function renderBoard(){
 const lv=liveRuns();logFor=null;clearSearch();setLeg('live');
 if(!lv.length){const r=allRuns()[0];
  $('main').innerHTML=`<div class="empty"><h2>// no worker running</h2>${r?`Last run: <span class="role" style="${rc(r.role)}">${esc(r.role)}</span> ${esc(title(r))}<br>${vtxt(r)}<br><br><button class="btn" id="openlast">open last run</button>`:'<span class="c">start one from the planner</span>'}</div>`;
  if(r)$('openlast').onclick=()=>open(r.project,r.id);return}
 $('main').innerHTML=`<div class="board">${lv.map(r=>`<div class="tile" data-p="${esc(r.project)}" data-id="${r.id}">
  <div class="th"><span class="pulse"></span><span class="role" style="${rc(r.role)}">${esc(r.role)}</span>
  <span class="what">${esc(title(r))}</span><span class="when">${esc(r.project)} · ${dur(Math.round((Date.now()-sdate(r.stamp))/1e3))}</span></div>
  <div class="tb">${(r.tail||[]).map(lineHTML).join('')||'<div class="l"><span class="x" style="color:var(--dim)">starting…</span></div>'}</div></div>`).join('')}</div>`;
 for(const d of document.querySelectorAll('.tile'))d.onclick=()=>open(d.dataset.p,d.dataset.id);
}
function renderDetail(){
 const key=view.p+'/'+view.id;const op=S.projects.find(x=>x.id===view.p);let r=(op&&op.open&&op.open.id===view.id&&op.open)||find(view.p,view.id);
 if(!r){view={k:'live'};return renderBoard()}
 setLeg(`run <span class="a">${esc(view.id)}</span>`);
 const chips=[r.project,r.repo&&r.repo!==r.project?r.repo:'',r.feature,r.ticket&&r.ticket!=='-'?r.ticket:'',r.model,r.backend&&r.backend!=='claude'?r.backend:'',
  r.turns&&r.turns!=='-'?r.turns+' turns':'',!r.live&&r.secs?dur(r.secs):'',r.cost!=null?'$'+r.cost.toFixed(2)+' list':'',r.denials&&r.denials!=='0'?r.denials+' denied':''].filter(Boolean);
 const head=`<div class="t"><button class="btn" id="back" title="Back to live">←</button>${r.live?'<span class="pulse"></span>':''}<span><span class="role" style="${rc(r.role)}">${esc(r.role)}</span> <span class="am">$</span> <span class="bl">${esc(title(r))}</span></span></div>
  <div class="v">${vtxt(r)}</div>
  <div class="c">${chips.map(esc).join(' · ')}</div>`;
 // the tools row is built once per run so the search box keeps focus and text across the 1 s refresh
 if(logFor!==key){clearSearch();$('main').innerHTML=`<div class="dh"><div id="dh"></div><div class="tools"><span id="fb"></span></div><div class="tools">
  <input id="ls" placeholder="search log…" aria-label="Search log"><span class="stat" id="lc"></span>
  <span class="sp"></span><label class="stat"><input type="checkbox" id="fol">follow</label></div></div><div class="log" id="log"></div>`;logFor=key;off=0;size=-1;
  $('ls').onkeydown=searchKey;$('ls').oninput=()=>{if(!$('ls').value.trim())clearSearch()}}
 $('dh').innerHTML=head;$('fol').checked=follow;
 $('fb').innerHTML=['all','say','edit','bash','denied','error'].map(f=>`<button class="btn ${filt===f?'on':''}" data-f="${f}">${f}</button>`).join('');
 document.getElementById('fs').textContent=filt==='all'?'':`.log .l:not([data-k="${filt}"]){display:none}`;
 $('back').onclick=()=>{view={k:'live'};render()};
 $('fol').onchange=e=>follow=e.target.checked;
 for(const b of document.querySelectorAll('[data-f]'))b.onclick=()=>{filt=b.dataset.f;renderDetail();keepCur()};
}
// --- log search: marks are CSS classes on the line elements; the reader numbers lines like the page does ---
let sr=null,size=-1; // sr = {text,hits:null while loading|[line numbers],capped,cur:line number|-1}
function clearSearch(){for(const e of document.querySelectorAll('#log .sm,#log .sc'))e.classList.remove('sm','sc');
 sr=null;if($('lc'))$('lc').textContent='';if($('ls'))$('ls').value=''}
function visHits(){const L=$('log');return sr&&sr.hits?sr.hits.filter(i=>L.children[i]&&L.children[i].offsetParent!==null):[]}
function showCount(){if(!sr||!sr.hits)return;const v=visHits(),n=v.indexOf(sr.cur)+1;
 $('lc').textContent=v.length?`${n} of ${sr.capped?'1000+':v.length}`:'no match'}
function keepCur(){if(!sr||!sr.hits)return;const v=visHits();if(v.includes(sr.cur))return showCount();
 goTo(v.find(i=>i>=sr.cur)??v[0]??-1)}
function goTo(i){const L=$('log');for(const e of L.querySelectorAll('.sc'))e.classList.remove('sc');
 sr.cur=i;if(i>=0){const e=L.children[i];e.classList.add('sc');e.scrollIntoView({block:'center'})}showCount()}
function step(dir){const v=visHits();if(!v.length){goTo(-1);return}
 const c=sr.cur;goTo(dir>0?(v.find(i=>i>c)??v[0]):([...v].reverse().find(i=>i<c)??v[v.length-1]))}
async function loadAll(key){while(key===logFor&&(size<0||off<size)){
 if(pulling){await new Promise(r=>setTimeout(r,50));continue}
 const o=off;await pull();if(off===o&&size>=0)break}}
async function searchKey(e){
 if(e.key==='Escape'){clearSearch();return}
 if(e.key!=='Enter')return;e.preventDefault();const text=$('ls').value.trim();if(!text)return;
 if(sr&&sr.hits&&sr.text===text){step(e.shiftKey?-1:1);return}
 if(sr&&!sr.hits)return;
 const key=logFor;clearSearch();$('ls').value=text;const my=sr={text,hits:null,capped:false,cur:-1};
 await loadAll(key);if(sr!==my||key!==logFor)return;
 let d;try{d=await window.pywebview.api.search(view.p,view.id,text)}catch(x){d=null}
 if(sr!==my||key!==logFor)return;
 if(!d||d.error){$('lc').textContent='search failed';sr=null;return}
 const L=$('log');my.hits=d.lines.filter(i=>L.children[i]);my.capped=!!d.capped;
 for(const i of my.hits)L.children[i].classList.add('sm');
 const top=L.getBoundingClientRect().top,v=visHits();
 goTo(v.length?(v.find(i=>L.children[i].getBoundingClientRect().top>=top)??v[0]):-1)}
function render(){renderTop();renderBar();renderSide();if(view.k==='run')renderDetail();else if(view.k==='settings')renderSettings();else renderBoard()}
let pulling=false;
async function pull(){
 if(view.k!=='run'||pulling)return;const L=$('log');if(!L)return;pulling=true;const key=logFor;
 try{const p=await API.progress(view.p,view.id,off);
  if(key!==logFor)return;
  if(p.text){const first=off===0;L.insertAdjacentHTML('beforeend',p.text.split(/\r?\n/).filter(l=>l.trim()).map(lineHTML).join(''));
   if((follow&&!sr)||first)L.scrollTop=L.scrollHeight}
  if(p.offset!==undefined)off=p.offset;if(p.size!==undefined)size=p.size;
  if(!L.children.length&&!p.text)L.innerHTML='<div class="empty" style="padding:30px">// no progress log for this run<br><small>runs/ stays on the machine that ran it</small></div>';
 }finally{pulling=false}}
async function tick(){
 try{S=await API.state(runFilter);await notifyDone();if(view.k==='settings'&&$('setv'))renderTop();else render();await pull()}catch(e){$('stats').textContent='reader error: '+e}
 setTimeout(tick,1000)}
const st=document.createElement('style');st.id='fs';document.head.appendChild(st);
$('proj').onchange=e=>{proj=e.target.value;store.set('proj',proj);if(view.k==='run'&&proj!=='*'&&view.p!==proj)view={k:'live'};render()};
$('q').value=runFilter.q;
$('q').oninput=()=>{runFilter.q=$('q').value.trim();changed()};
$('livebtn').onclick=()=>{view={k:'live'};render()};

// --- desktop app: Python bridge (pywebview), settings, finished-run toasts ---
const API={state:flt=>view.k==='run'?window.pywebview.api.state(flt,{project:view.p,run:view.id}):window.pywebview.api.state(flt),progress:(p,r,o)=>window.pywebview.api.progress(p,r,o),
 config:()=>window.pywebview.api.get_config(),save:c=>window.pywebview.api.save_config(c),pick:()=>window.pywebview.api.pick_folder()};
async function notifyDone(){
 const now=new Map(S.projects.flatMap(p=>(p.live_runs||[]).map(r=>[r.project+'\n'+r.id,r])));
 const gone=seenLive?[...seenLive.keys()].filter(k=>!now.has(k)):[];
 seenLive=now;
 if(!gone.length)return;
 // the finished run may be cut by the run filter: read it from an unfiltered state
 let all=S;if(gone.some(k=>{const [pp,id]=k.split('\n');return!find(pp,id)||find(pp,id).live}))try{all=await API.state({})}catch(e){}
 for(const k of gone){const [pp,id]=k.split('\n'),p=all.projects.find(x=>x.id===pp),r=p&&p.runs.find(x=>x.id===id);if(r&&!r.live)toast(r)}}
function toast(r){const ok=vk(r.verdict)==='ok',d=document.createElement('div');d.className='toast';d.style.cssText=`--c:var(--${ok?'ok':'bad'})`;
 d.innerHTML=`<div class="row"><span class="role" style="${rc(r.role)}">${esc(r.role)}</span><span class="proj">${esc(r.project)}</span></div>
  <div class="what">${esc(title(r))}</div><div class="v">${vtxt(r)}</div>`;
 d.onclick=()=>{open(r.project,r.id);d.remove()};$('toasts').appendChild(d);setTimeout(()=>d.remove(),15000);
 window.pywebview.api.notify(`${r.role} ${ok?'passed':'did not pass'}`,`${r.project}: ${title(r)} — ${r.verdict||''}`)}
let CFG=null;
async function renderSettings(){
 logFor=null;CFG=CFG||await API.config();setLeg('settings');
 const list=(k,label)=>CFG[k].map((x,i)=>`<div class="row"><code title="${esc(x)}">${esc(x)}</code><button class="btn" data-del="${k}:${i}">remove</button></div>`).join('')||`<p>// no ${label} yet.</p>`;
 $('main').innerHTML=`<div class="set" id="setv"><h2>Project folders</h2><p>// saved in <code>${esc(CFG.path)}</code>. Changes apply at once.</p>
  <h3>Roots</h3><p>// every <code>.scratch</code> with runs, up to 3 folders below.</p>${list('roots','roots')}<button class="btn" data-add="roots">+ add root…</button>
  <h3>Single scratch folders</h3><p>// a project's <code>.scratch</code> (or a workspace scratch folder) outside any root.</p>${list('scratch','folders')}<button class="btn" data-add="scratch">+ add scratch folder…</button>
  <h3>Updates</h3><p>// new versions come from GitHub Releases; nothing is installed until you click update.</p>
  <div class="row"><label><input type="checkbox" id="setupd" ${CFG.check_updates!==false?'checked':''}>check at startup</label>
  <button class="btn" id="setchk">check for updates</button><span class="stat" id="setchkr"></span></div>
  <h3>Found now</h3><div class="found">${S.projects.map(p=>`<div>${esc(p.id)} — ${p.run_count} runs · <code>${esc(p.path)}</code></div>`).join('')||'none'}</div>
  <br><button class="btn" id="setdone">done</button></div>`;
 for(const b of document.querySelectorAll('[data-del]'))b.onclick=async()=>{const [k,i]=b.dataset.del.split(':');CFG[k].splice(+i,1);CFG=await API.save(CFG);S=await API.state(runFilter);renderSettings()};
 for(const b of document.querySelectorAll('[data-add]'))b.onclick=async()=>{const f=await API.pick();if(f&&!CFG[b.dataset.add].includes(f)){CFG[b.dataset.add].push(f);CFG=await API.save(CFG);S=await API.state(runFilter)}renderSettings()};
 $('setupd').onchange=async e=>{CFG.check_updates=e.target.checked;CFG=await API.save(CFG)};
 $('setchk').onclick=async()=>{$('setchkr').textContent='checking…';const r=await checkUpdate(false);
  $('setchkr').textContent=r.error?r.error:r.newer?`${r.latest} available (see the top bar)`:`up to date (${r.current})`};
 $('setdone').onclick=()=>{view={k:'live'};render()};
}
$('setbtn').onclick=()=>{view={k:'settings'};CFG=null;render()};
$('ghbtn').onclick=()=>window.pywebview.api.open_repo();
// --- self-update (docs/open/auto-update.md): a banner with the version tag; nothing changes until update is clicked ---
async function checkUpdate(auto){let r;try{r=await window.pywebview.api.check_update(auto)}catch(e){r={error:String(e)}}
 const u=$('upd');if(r.newer){u.hidden=false;u.innerHTML=r.source?`<span class="long">${esc(r.latest)} available - running from source: git pull</span><span class="short">${esc(r.latest)}: git pull</span>`
  :`<span class="long">${esc(r.latest)} available </span><button class="btn" id="updbtn"><span class="long">update</span><span class="short">update ${esc(r.latest)}</span></button>`;
  if(!r.source)$('updbtn').onclick=async()=>{$('updbtn').disabled=true;u.textContent=`installing ${r.latest}… `;
   let a;try{a=await window.pywebview.api.apply_update()}catch(e){a={error:String(e)}}
   if(a.error){u.innerHTML=`<span class="warn">update failed: ${esc(a.error)}</span>`}else u.textContent=`restarting as ${a.installed}…`}}
 return r}
// the bridge can be ready before this script runs (measured on GTK), so start on whichever comes first
let started=false;const start=()=>{if(!started&&window.pywebview&&window.pywebview.api&&window.pywebview.api.state){started=true;tick();checkUpdate(true)}};
window.addEventListener('pywebviewready',start);start();setTimeout(function w(){if(!started){start();setTimeout(w,100)}},100);
</script></body></html>
