name: release
# On a tag v*: build the one-file app for Windows and Linux and attach both to a GitHub release.
# Actions are pinned by commit SHA (same major versions as before): this workflow can write releases, so a moved
# tag in a third-party action could publish someone else's binary.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      matrix:
        include:
          - os: windows-latest
            file: hermes-dev-watch.exe
            asset: hermes-dev-watch-windows-x64.exe
          - os: ubuntu-24.04
            file: hermes-dev-watch
            asset: hermes-dev-watch-linux-x64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0
        with:
          persist-credentials: false
      - name: Linux system libraries (GTK, WebKit2GTK 4.1, PyGObject)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y python3-gi python3-gi-cairo gir1.2-gtk-3.0 gir1.2-webkit2-4.1 python3-venv
      - name: Build (Linux, system Python so PyGObject is available)
        if: runner.os == 'Linux'
        run: |
          /usr/bin/python3 -m venv --system-site-packages .venv
          .venv/bin/pip install -r requirements.txt pyinstaller
          .venv/bin/python -c "import hermes_dev_watch.core, hermes_dev_watch.app"
          .venv/bin/pyinstaller --noconfirm hermes-dev-watch.spec
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5.6.0
        if: runner.os == 'Windows'
        with:
          python-version: "3.12"
      - name: Build (Windows)
        if: runner.os == 'Windows'
        run: |
          python -m pip install -r requirements.txt pyinstaller
          python -c "import hermes_dev_watch.core, hermes_dev_watch.app"
          pyinstaller --noconfirm hermes-dev-watch.spec
      - name: Rename
        shell: bash
        run: mv "dist/${{ matrix.file }}" "dist/${{ matrix.asset }}"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4.6.2
        with:
          name: ${{ matrix.asset }}
          path: dist/${{ matrix.asset }}
      - uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65  # v2.6.2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: dist/${{ matrix.asset }}
